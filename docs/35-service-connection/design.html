or:pointer;color:var(--muted);list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:"›";font-size:20px;transform:rotate(90deg)}details[open]>summary:after{transform:rotate(-90deg)}.details-body{padding:4px 0 12px}.setting-label{display:block;font-weight:500;margin:10px 0 6px}.calendar-option{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}.calendar-option input{position:static;border-radius:5px;width:20px;height:20px}.small-note{font-size:.9em;color:var(--muted);line-height:1.7;margin:5px 0}.advanced-link{display:block;min-height:44px;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}.screen-message{font-size:.7em;color:var(--action);line-height:1.6;padding-top:3px}.focus-card{padding:19px 18px 16px;background:var(--panel);border-radius:19px;text-align:center;margin:3px 0 15px}.focus-icon{display:grid;place-items:center;width:56px;height:56px;border-radius:17px;background:var(--icon);color:white;margin:0 auto 12px}.focus-icon svg{width:30px;height:30px}.focus-card h3{font-size:1.02em;font-weight:600;margin-bottom:5px}.focus-card p{font-size:.72em;color:var(--muted);line-height:1.6}.progress-track{height:4px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:18px}.progress-track i{display:block;height:100%;background:var(--accent);border-radius:5px}.progress-count{display:block;text-align:right;font-size:.63em;color:var(--muted);margin-top:7px}.step-row{display:flex;align-items:center;gap:11px;min-height:48px;border-bottom:1px solid var(--line);padding:10px 0;font-size:.78em}.step-row .step-symbol{color:var(--muted);width:20px;height:20px}.step-name{flex:1;min-width:0}.step-state{font-size:.8em;color:var(--muted);text-align:right;max-width:45%}.step-state.active{color:var(--action)}.done-check{color:var(--action);font-size:17px}.result-hero{text-align:center;padding:18px 0 23px}.result-stack{display:flex;justify-content:center;align-items:center;padding-bottom:17px}.result-stack .service-icon{width:42px;height:42px;border-radius:14px;border:3px solid var(--canvas);margin:0 -4px;box-shadow:0 3px 8px #00000008;transform:rotate(-7deg)}.result-stack .service-icon:nth-child(2){transform:rotate(5deg) translateY(-4px)}.result-stack .service-icon:nth-child(3){transform:rotate(-4deg)}.result-hero h3{font-size:1.35em;font-weight:600;letter-spacing:-.6px;line-height:1.45}.result-hero p{font-size:.75em;color:var(--muted);line-height:1.7;margin-top:8px}.pending-card{background:var(--panel);border-radius:15px;padding:0 13px}.pending-row{display:flex;align-items:center;gap:10px;min-height:65px;padding:11px 0;border-bottom:1px solid var(--line)}.pending-row:last-child{border:0}.pending-copy{flex:1;min-width:0}.pending-copy b{display:block;font-size:.79em;font-weight:500}.pending-copy small{display:block;color:var(--muted);font-size:.67em;line-height:1.6}.pending-row button{font-size:.68em;color:var(--action);min-height:44px;min-width:44px;text-align:right;padding:6px 0 6px 6px;max-width:38%}.result-detail{margin-top:15px}.result-detail .step-state{max-width:52%;line-height:1.6}.edit-selection{font-size:.72em;color:var(--muted);text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:8px 0;display:block;margin:7px auto}.spinner{display:inline-block;width:12px;height:12px;border:1.8px solid var(--line);border-top-color:var(--action);border-radius:50%;animation:spin 1.5s linear infinite;margin-right:5px;vertical-align:-1px}@keyframes spin{to{transform:rotate(360deg)}}.prompt-overlay{position:absolute;inset:0;background:#0005;display:grid;place-items:center;padding:25px;z-index:3;backdrop-filter:blur(3px)}.prompt{width:100%;border-radius:22px;background:var(--canvas);padding:23px;box-shadow:0 10px 40px #0002}.prompt small{color:var(--muted);font-size:.65em}.prompt h3{font-size:1.1em;font-weight:600;line-height:1.5;margin:10px 0}.prompt p{font-size:.78em;color:var(--muted)}.prompt-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.prompt-actions button{flex:1;min-width:95px;min-height:44px;padding:9px;border-radius:12px;background:var(--panel);font-size:.78em}.prompt-actions button:last-child{background:var(--accent);color:var(--accent-ink)}body.large{--font:21px}body.large .intro{padding-top:4px;padding-bottom:12px;min-height:120px}body.large .service-label{min-height:118px}body.single>header{display:none}body.single main{display:block;padding:0;width:var(--width)}body.single .scene{display:none}body.single .scene:first-child{display:block}body.single .caption{display:none}body.single .phone{height:100vh;border:0;border-radius:0;box-shadow:none}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}

<body>
<header><h1>Moveliq · 连接你的日常</h1><p>首次连接 · 第二版设计预览。这里不会申请真实权限。</p>
<div class="controls"><button class="control" id="theme">切换深浅色</button><label class="control">宽度 <select id="width"><option>390</option><option>320</option><option>430</option></select></label><label class="control"><input type="checkbox" id="large">大字体</label><label class="control">第一屏 <select id="scenario"><option value="initial">首次进入</option><option value="progress">连接中</option><option value="success">完成连接</option><option value="partial">部分完成</option><option value="calendar">日历待选择</option><option value="empty">未选服务</option><option value="unsupported">旧系统 / 受限制</option><option value="revoked">系统撤回权限</option><option value="stopped">停止后续连接</option></select></label></div></header>
<main>
<section class="scene"><p class="caption"><b>01</b>选择想连接的服务</p><div class="phone" id="first"></div></section>
<section class="scene"><p class="caption"><b>02</b>聚焦当前连接项</p><div class="phone" id="progress"></div></section>
<section class="scene"><p class="caption"><b>03</b>完成后直接开始使用</p><div class="phone" id="result"></div></section>
</main>
<script>
const definitions=[
 {id:'health',name:'健康',hint:'只读睡眠、心率与运动摘要',path:'M20 5c-3-3-7-1-8 2C9 4 5 2 2 5c-4 5 3 11 10 16 7-5 14-11 8-16Z'},
 {id:'calendar',name:'日历',hint:'结合日程安排训练',path:'M5 4h14v17H5z M8 2v5 M16 2v5 M5 10h14 M8 14h3 M14 14h2'},
 {id:'alarms',name:'闹钟',hint:'管理 Moveliq 创建的提醒',path:'M18 14a6 6 0 1 1-12 0 6 6 0 0 1 12 0 M12 10v4l3 2 M3 6l3-3 M18 3l3 3 M7 20l-2 2 M17 20l2 2'},
 {id:'music',name:'Apple 音乐',hint:'播放你的训练音乐',path:'M9 18V5l11-3v13 M9 8l11-3 M9 18c0 2-5 4-5 1 0-2 5-4 5-1 M20 15c0 2-5 4-5 1 0-2 5-4 5-1'},
 {id:'maps',name:'地图',hint:'使用期间定位，查找附近地点',path:'M12 22S4 13 4 8a8 8 0 0 1 16 0c0 5-8 14-8 14 M15 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0'},
 {id:'browser',name:'内置浏览器',hint:'联网查资料，由你确认网页内容',path:'M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0 M2 12h20 M12 2c6 6 6 14 0 20-6-6-6-14 0-20'}
];
const descriptions={authorized:'已授权',ready:'已启用，无需系统授权',healthDone:'已完成授权选择',scope:'已授权 · 请选择日历',denied:'未允许 · 可前往系统设置',restricted:'系统限制，暂不可用',unavailable:'需要 iOS 26 或更新版本',waiting:'尚未处理',requesting:'等待系统授权选择',revoked:'授权已撤回',failed:'连接失败，可稍后重试'};
const states=new Map();
function preset(kind){const s={kind,stage:['success','partial','calendar','revoked','stopped'].includes(kind)?'result':'selection',selected:new Set(['health','calendar','alarms','browser']),results:{},scope:false,busy:false,queue:[],current:null,skipped:false,message:''};
 if(kind==='empty')s.selected.clear();
 if(kind==='progress'){s.busy=true;s.results.health='healthDone';s.results.calendar='requesting';s.current='calendar';}
 if(kind==='success'){s.scope=true;s.results={health:'healthDone',calendar:'authorized',alarms:'authorized',browser:'ready'};}
 if(kind==='partial'){s.selected.add('music');s.scope=true;s.results={health:'healthDone',calendar:'authorized',alarms:'authorized',music:'denied',browser:'ready'};}
 if(kind==='calendar'){s.results={health:'healthDone',calendar:'scope',alarms:'authorized',browser:'ready'};}
 if(kind==='unsupported'){s.results={health:'restricted',alarms:'unavailable'};}
 if(kind==='revoked'){s.results={health:'healthDone',calendar:'revoked',alarms:'authorized',browser:'ready'};}
 if(kind==='stopped'){s.results={health:'healthDone',calendar:'authorized',alarms:'waiting',browser:'waiting'};s.scope=true;s.message='已停止后续连接。已完成的系统选择会保留。';}
 return s;}
function good(value){return ['authorized','ready','healthDone'].includes(value)}

const iconColors={health:'#e97579',calendar:'#648c83',alarms:'#c49b52',music:'#bc7b91',maps:'#7c9b73',browser:'#7299b4'};
const shortHints={health:'睡眠与恢复',calendar:'安排训练时间',alarms:'训练前提醒',music:'训练时播放',maps:'附近与路线',browser:'查资料与网页'};
function icon(d,extra=''){return `<span class="service-icon ${extra}" style="--icon:${iconColors[d.id]}" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="${d.path}"></path></svg></span>`;}
function stepRows(items,s){return items.map(d=>{const v=s.results[d.id],done=good(v),status=v==='healthDone'?'已完成选择':v==='requesting'?'等待系统选择':v==='ready'?'无需系统授权':done?'已授权':descriptions[v]??'等待连接';return `<div class="step-row"><svg class="step-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="${d.path}"></path></svg><span class="step-name">${d.name}</span><span class="step-state ${v==='requesting'?'active':''}">${v==='requesting'?'<i class="spinner" aria-hidden="true"></i>':''}${done?'<span class="done-check" aria-hidden="true">✓ </span>':''}${status}</span></div>`}).join('');}
function render(id){const box=document.getElementById(id),s=states.get(id),selected=definitions.filter(x=>s.selected.has(x.id)),done=selected.filter(x=>good(s.results[x.id])).length,finished=!s.editing&&s.stage==='result'&&!s.busy;
 const pending=selected.filter(x=>!good(s.results[x.id])),partial=finished&&pending.length>0;
 const current=definitions.find(d=>d.id===s.current),processed=selected.filter(d=>s.results[d.id]&&!['waiting','requesting'].includes(s.results[d.id])).length;
 let content='';
 if(s.busy){content=`<div class="focus-card" role="status"><div class="focus-icon" style="--icon:${iconColors[current?.id]??iconColors.calendar}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${current?.path??definitions[1].path}"></path></svg></div><h3>正在连接${current?.name??'服务'}</h3><p>在系统弹窗中选择是否允许。</p><div class="progress-track"><i style="width:${Math.max(7,processed/Math.max(1,selected.length)*100)}%"></i></div><span class="progress-count">${processed} / ${selected.length} 项已处理</span></div><div class="connection-steps">${stepRows(selected,s)}</div>`;}
 else if(finished){content=`<div class="result-hero" role="status"><div class="result-stack">${selected.filter(x=>good(s.results[x.id])).slice(0,4).map(d=>icon(d)).join('')}</div><h3>${done?`${done} 项连接已完成`:'稍后也能继续'}</h3><p>${partial?'已完成的可以先用，<br>其余服务随时补连。':'准备好了，开始你的训练日常吧。'}</p></div>${pending.length?`<div class="pending-card">${pending.map(d=>{const v=s.results[d.id];const action=['denied','revoked'].includes(v)?'settings':v==='scope'?'scope':['restricted','unavailable'].includes(v)?null:'retry';return `<div class="pending-row">${icon(d)}<span class="pending-copy"><b>${d.name}</b><small>${v==='scope'?'还需选择日历':v==='denied'?'尚未允许':descriptions[v]??'尚未处理'}</small></span>${action?`<button data-action="${action}">${action==='settings'?'去设置':action==='scope'?'选择':'继续'}</button>`:''}</div>`}).join('')}</div>`:''}<details class="result-detail"><summary>查看连接详情</summary><div>${stepRows(selected,s)}<p class="small-note">健康数据按系统中实际允许的范围读取；音乐播放取决于订阅与可播放内容。</p></div></details><button class="edit-selection" data-action="edit">调整服务选择</button>`;}
 else {content=`<div class="selection-count"><span>按需选择，随时可调整</span><span>已选 ${selected.length} 项</span></div><ul class="services">${definitions.map(d=>{const v=s.results[d.id],disabled=['unavailable','restricted'].includes(v);return `<li class="service"><label class="service-label ${disabled?'disabled':''}">${icon(d)}<input aria-label="连接${d.name}" data-service="${d.id}" type="checkbox" ${s.selected.has(d.id)?'checked':''} ${disabled?'disabled':''}><span class="service-copy"><strong>${d.name}</strong><small class="${v&&!good(v)?'warn':''}">${s.selected.has(d.id)&&v?descriptions[v]:shortHints[d.id]}</small></span></label></li>`}).join('')}</ul>`;}
 const settings=`<details class="advanced-settings" ${s.results.calendar==='scope'?'open':''}><summary>${finished?'更多设置':'连接设置'}</summary><div class="details-body">${s.selected.has('calendar')?`<span class="setting-label">允许查询的日历</span>${['authorized','scope'].includes(s.results.calendar)?`<label class="calendar-option">我的日历<input data-calendar type="checkbox" ${s.scope?'checked':''} aria-label="允许查询我的日历"></label><p class="small-note">默认写入：${s.scope?'我的日历':'尚未选择'}。不会自动选择全部日历。</p>`:'<p class="small-note">连接后选择允许 Milo 查询的日历。</p>'}`:''}<button class="advanced-link" data-action="sync">训练日历与闹钟同步 ›</button><button class="advanced-link" data-action="music">选择训练音乐 ›</button><button class="advanced-link" data-action="siri">Siri 与快捷指令 ›</button><p class="small-note">地图定位仅在使用期间请求，不在后台跟踪；不允许定位仍可手填地点。连接不改变你保存的同步与自动调整规则。</p></div></details>`;
 box.innerHTML=`<div class="statusbar"><span>9:41</span><span aria-hidden="true">▂▄▆ ▰</span></div><div class="nav"><span class="brand"><i></i>Moveliq</span><span style="color:var(--muted)">你的运动伙伴</span></div><div class="intro"><div class="avatar"><img alt="" src="../18-milo-home/assets/milo.png"></div><div class="welcome-copy"><b>嗨，我是 Milo</b><p>让训练融入日常。</p></div></div><section class="connection-sheet ${s.busy?'is-busy':''}"><div class="sheet-head"><div class="head-row"><h2>${s.busy?'正在连接':finished?'开始新日常':'连接你的日常'}</h2><button class="skip" data-action="skip" ${s.busy?'disabled':''}>${finished?'稍后处理':'稍后再说'}</button></div>${!finished&&!s.busy?'<p class="sheet-caption">选好服务，接下来跟着系统提示允许。</p>':''}</div><div class="screen">${content}${s.busy?'':settings}<p class="screen-message" role="status">${s.message}</p></div><div class="footer"><button class="primary" data-action="${s.busy?'stop':finished?'finish':'connect'}" ${!selected.length?'disabled':''}>${s.busy?'暂停后续连接':finished?'开始使用':'连接所选服务'}${!s.busy?'<span class="arrow" aria-hidden="true">→</span>':''}</button><p class="footer-note">${s.busy?'暂停不会撤回已授予的系统权限。':finished?'之后仍可在设置中调整连接。':'系统弹窗需要逐项确认。'}</p></div><div class="home-indicator" aria-hidden="true"></div></section>`;
 box.querySelectorAll('[data-service]').forEach(input=>input.addEventListener('change',()=>{input.checked?s.selected.add(input.dataset.service):s.selected.delete(input.dataset.service);s.editing=true;s.message='';const key=input.dataset.service;render(id);box.querySelector('[data-service='+key+']').focus({preventScroll:true})}));
 box.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>action(id,button.dataset.action)));
 box.querySelector('[data-calendar]')?.addEventListener('change',e=>{s.scope=e.target.checked;s.results.calendar=s.scope?'authorized':'scope';render(id)});
}
function action(id,type){const s=states.get(id);if(type==='connect'||type==='retry'){if(s.busy||!s.selected.size)return;s.busy=true;s.skipped=false;s.editing=false;s.stage='progress';s.queue=definitions.filter(d=>s.selected.has(d.id)&&(!s.results[d.id]||['waiting','failed'].includes(s.results[d.id]))).map(d=>d.id);next(id);}
 else if(type==='stop'){s.busy=false;s.stage='result';if(s.current&&s.results[s.current]==='requesting')s.results[s.current]='waiting';s.current=null;for(const k of s.queue)s.results[k]='waiting';s.queue=[];s.message='已停止后续连接。系统已授予的权限会保留。';render(id);}
 else if(type==='skip'||type==='finish'){s.skipped=true;s.message='预览：进入首页。下次启动不再强制展示，可从设置补连。';render(id);}
 else if(type==='scope'){const details=document.querySelector('#'+id+' .advanced-settings');details.open=true;details.scrollIntoView({block:'nearest'});}
 else if(type==='edit'){s.editing=true;s.message='';render(id);}
 else if(type==='settings'){s.message='预览：打开 Moveliq 的系统设置；返回时重新核对授权。';render(id);}
 else {s.message='预览：打开已有的'+({sync:'训练同步设置',music:'音乐选择',siri:'Siri 入口说明'}[type])+'，不改变既有配置。';render(id);}}
function next(id){const s=states.get(id);if(!s.busy)return;const current=s.queue.shift();if(!current){s.busy=false;s.current=null;s.stage='result';render(id);document.querySelector('#'+id+' .primary').focus({preventScroll:true});return;}s.current=current;if(current==='browser'){s.results.browser='ready';next(id);return;}s.results[current]='requesting';render(id);showPrompt(id,current);}
function showPrompt(id,current){const box=document.getElementById(id),d=definitions.find(d=>d.id===current),layer=document.createElement('div');layer.className='prompt-overlay';layer.innerHTML=`<div class="prompt" role="alertdialog" aria-modal="true" aria-labelledby="prompt-${id}"><small>设计预览 · 系统授权示意</small><h3 id="prompt-${id}">允许 Moveliq 访问${d.name}？</h3><p>${d.hint}。实际弹窗由 iOS 提供。</p><div class="prompt-actions"><button data-deny>模拟不允许</button><button data-allow>模拟允许</button></div></div>`;box.appendChild(layer);const resolve=allow=>{const s=states.get(id);s.results[current]=!allow?'denied':current==='health'?'healthDone':current==='calendar'&&!s.scope?'scope':'authorized';layer.remove();next(id);};layer.querySelector('[data-allow]').onclick=()=>resolve(true);layer.querySelector('[data-deny]').onclick=()=>resolve(false);const buttons=[...layer.querySelectorAll('button')];buttons[0].focus();layer.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();buttons[(buttons.indexOf(document.activeElement)+(e.shiftKey?-1:1)+buttons.length)%buttons.length].focus();}if(e.key==='Escape'){e.preventDefault();resolve(false);}});}
function reset(kind){states.set('first',preset(kind));render('first');}
states.set('progress',preset('progress'));states.set('result',preset('partial'));reset('initial');render('progress');render('result');
document.getElementById('scenario').onchange=e=>reset(e.target.value);document.getElementById('theme').onclick=()=>document.body.classList.toggle('dark');document.getElementById('width').onchange=e=>document.documentElement.style.setProperty('--width',e.target.value+'px');document.getElementById('large').onchange=e=>document.body.classList.toggle('large',e.target.checked);
const params=new URLSearchParams(location.search);if(params.get('theme')==='dark')document.body.classList.add('dark');if(params.get('large')==='1')document.body.classList.add('large');if(params.get('single')==='1')document.body.classList.add('single');if(['320','390','430'].includes(params.get('width')))document.documentElement.style.setProperty('--width',params.get('width')+'px');if(params.has('state'))reset(params.get('state'));
</script>
</body></html>
