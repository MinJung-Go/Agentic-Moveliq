<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moveliq · 跨页配色对照</title><style data-preview-source="design.css">

:root{color-scheme:light;--page:#fffefa;--surface:#f3f0e8;--field:#efede7;--ink:#272723;--sub:#65645f;--meta:#77746d;--line:#e8e5de;--action:#986219;--on:#fffefa;--stage:#e9e7e1;--danger:#a83232}

*{box-sizing:border-box}body{margin:0;background:var(--stage);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif}button,input,textarea,select{font:inherit;color:inherit}button,a,summary{touch-action:manipulation}button{cursor:pointer;border:0;background:none;min-height:44px;min-width:44px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--action);outline-offset:3px}a{color:var(--action)}[hidden]{display:none!important}h1,h2,h3,p{margin:0}header{max-width:1600px;padding:48px 32px 24px;margin:auto;display:flex;justify-content:space-between;gap:24px;align-items:flex-end}header small{font-size:11px;letter-spacing:2px;color:var(--sub)}h1{font-size:32px;font-weight:600;letter-spacing:-1px;margin:9px 0}header p{color:var(--sub);max-width:720px}.controls{display:flex;flex-wrap:wrap;gap:8px}.controls button,.controls select{background:var(--page);border-radius:10px;padding:8px 13px;min-height:44px;border:1px solid var(--line)}.controls [aria-pressed=true]{box-shadow:inset 0 0 0 1px var(--action)}.palette{max-width:1536px;margin:0 auto 28px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;flex-wrap:wrap}.palette span{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}.swatch{display:inline-block;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px #8884}.palette .note{margin-left:auto}.gallery{max-width:1600px;padding:0 32px 32px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.caption{font-size:12px;color:var(--sub);margin:0 3px 12px;display:flex;justify-content:space-between;gap:10px}.phone{height:790px;background:var(--page);border:6px solid #292a27;border-radius:43px;overflow:hidden;position:relative;display:flex;flex-direction:column;isolation:isolate}.status{height:45px;flex-shrink:0;padding:12px 22px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:600}.island{position:absolute;left:50%;transform:translateX(-50%);top:9px;height:23px;width:87px;background:#080908;border-radius:18px}.nav{min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0;gap:8px}.nav strong{font-size:16px;font-weight:600}.nav button{color:var(--action);font-size:15px;padding:0 6px}.nav .icon{font-size:22px}.scroll{padding:8px 22px 28px;overflow:auto;flex:1;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}h2{font-size:29px;line-height:1.3;letter-spacing:-.8px;font-weight:650;margin-bottom:9px}h3{font-size:18px;font-weight:600}.intro{font-size:14px;color:var(--sub);margin-bottom:25px}.home{height:5px;width:112px;border-radius:4px;background:var(--ink);margin:10px auto 8px;flex-shrink:0}.primary{background:var(--action);color:var(--on);border-radius:12px;width:100%;font-weight:600;min-height:48px}.primary:disabled{opacity:.5;cursor:default}.searchbox{background:var(--field);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 12px;margin:18px 0 23px;min-height:44px;color:var(--sub)}.searchbox input{border:0;background:none;width:100%;min-width:0;font-size:15px;outline-offset:0}.searchbox input::placeholder{color:var(--sub)}.section-label{font-size:12px;color:var(--meta);margin:25px 0 8px;display:flex;justify-content:space-between}.session{display:block;width:100%;text-align:left;padding:14px 12px;border-radius:12px}.session[aria-current=true]{background:var(--surface)}.session-title{display:flex;align-items:baseline;gap:10px;justify-content:space-between;font-size:16px;font-weight:550}.session time{font-size:12px;white-space:nowrap;color:var(--sub);font-weight:400}.session p{font-size:14px;color:var(--sub);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.current{color:var(--action);margin-right:5px}.bottom-action{margin:20px 0 0;border-top:1px solid var(--line);padding-top:14px}.row-link{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:12px 0;font-size:15px}.chevron{color:var(--meta)}.footnote{font-size:12px;color:var(--sub);line-height:1.7;margin-top:16px}.tabs{display:flex;background:var(--field);padding:3px;border-radius:10px;margin:22px 0 23px}.tabs button{flex:1;min-width:0;font-size:14px;border-radius:7px;color:var(--sub)}.tabs [aria-selected=true]{color:var(--ink);background:var(--page);box-shadow:0 1px 3px #0001;font-weight:600}.entry{width:100%;display:block;text-align:left;padding:16px 0;border-bottom:1px solid var(--line)}.entry .label{font-size:12px;color:var(--sub);margin-bottom:5px}.entry .value{font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:12px;line-height:1.5;white-space:pre-wrap}.entry .value span:first-child{min-width:0;overflow-wrap:anywhere}.entry .description{font-size:14px;color:var(--sub);margin:6px 0 0}.subtle{color:var(--sub)}.eyebrow{font-size:12px;color:var(--sub);margin:18px 0 12px}.detail-title{font-size:28px;margin-bottom:24px}.reading{font-size:17px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}.details-section{margin-top:32px}details{border-top:1px solid var(--line)}summary{cursor:pointer;min-height:52px;display:flex;align-items:center;justify-content:space-between;list-style:none;font-size:14px;gap:12px}summary::-webkit-details-marker{display:none}details p{font-size:14px;color:var(--sub);margin:0 0 16px}.danger{color:var(--danger)}.toggle{background:var(--action);width:46px;min-height:28px;border-radius:20px;padding:3px;flex-shrink:0}.toggle:after{content:'';display:block;width:22px;height:22px;border-radius:50%;background:var(--on);margin-left:18px}.toggle[aria-checked=false]{background:var(--meta)}.toggle[aria-checked=false]:after{margin-left:0}.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:24px;padding:16px 0;border-top:1px solid var(--line);font-size:15px}.empty{padding:45px 4px;text-align:center}.empty h3{margin-bottom:10px}.empty p{font-size:14px;color:var(--sub)}.toolbar-demo{margin:16px 0 0;color:var(--sub);font-size:12px}.toolbar-demo select{width:100%;background:var(--field);border:0;border-radius:10px;padding:11px;margin-top:6px}.source{padding:19px 0;border-bottom:1px solid var(--line)}.source .host{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;margin-bottom:7px}.source h3{font-size:17px;line-height:1.5}.source p{font-size:14px;color:var(--sub);margin:9px 0}.source button{color:var(--action);font-size:14px;padding-left:0}.status-message{background:var(--surface);padding:17px;border-radius:12px;margin:20px 0;font-size:14px;color:var(--sub)}.status-message h3{font-size:17px;color:var(--ink);margin-bottom:7px}.status-message button{color:var(--action);padding-left:0}.query-title{font-size:23px;line-height:1.45;margin-top:7px}.badge{font-size:12px;color:var(--sub);margin:10px 0 4px}.footer-notes{max-width:1536px;margin:12px auto 45px;border-top:1px solid var(--line);padding:24px 0;font-size:14px;line-height:1.8;color:var(--sub)}.footer-notes strong{color:var(--ink)}.footer-notes p{margin:9px 0}.sheet{position:absolute;inset:60px 0 0;background:var(--page);border-radius:22px 22px 0 0;box-shadow:0 -20px 30px #0002;display:flex;flex-direction:column;z-index:5}.sheet .scroll{padding-top:20px}.field-label{font-size:13px;color:var(--sub);display:block;margin-bottom:10px}.editor{width:100%;min-height:170px;padding:14px;background:var(--field);border:0;border-radius:12px;resize:vertical;font-size:17px;line-height:1.65}.toast{position:absolute;bottom:29px;left:16px;right:16px;padding:12px 16px;background:var(--ink);color:var(--page);font-size:13px;border-radius:12px;z-index:9}.demo-banner{font-size:12px;color:var(--sub);margin-top:15px}.large .phone .value,.large .reading,.large .session-title,.large .editor{font-size:22px}.large .phone .intro,.large .session p,.large .source p,.large .entry .description{font-size:18px}.large .phone .label,.large .footnote,.large .source .host{font-size:15px}.narrow .gallery{grid-template-columns:repeat(4,320px);justify-content:center}.narrow .phone{width:320px}.narrow .scroll{padding-left:20px;padding-right:20px}.page-map{display:flex;flex-wrap:wrap;gap:12px;margin-top:15px}.page-map span{background:var(--surface);padding:8px 15px;border-radius:8px;font-size:13px}.preview-bottom{padding:14px 20px;border-top:1px solid var(--line);background:var(--page);font-size:13px;color:var(--sub);display:flex;justify-content:space-between}.preview-bottom b{color:var(--action);font-weight:500}
@media(max-width:1400px){.gallery,.narrow .gallery{grid-template-columns:repeat(2,minmax(300px,380px));justify-content:center}.narrow .gallery{grid-template-columns:repeat(2,320px)}.palette,.footer-notes{margin-left:32px;margin-right:32px}.palette .note{margin-left:0}}
@media(max-width:720px){header{padding:28px 20px;display:block}h1{font-size:26px}.controls{margin-top:20px}.gallery,.narrow .gallery{display:flex;flex-direction:column;align-items:center;padding:0 12px}.board{width:100%;max-width:380px}.narrow .board{max-width:320px}.narrow .phone{width:100%}.palette,.footer-notes{margin-left:20px;margin-right:20px}.phone{border-width:5px}.palette{gap:12px}.caption{margin-top:12px}}

.gallery{grid-template-columns:repeat(3,minmax(0,370px));justify-content:center}.phone{height:720px}.panel{background:var(--surface);border-radius:16px;padding:20px;margin:18px 0}.panel p{font-size:14px;color:var(--sub);margin-top:8px}.metric{font-size:32px;font-weight:600;margin-top:10px}.journal-row{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);font-size:16px}.journal-row time{font-size:12px;color:var(--sub);padding-top:3px;width:38px;flex-shrink:0}.journal-row p{font-size:14px;color:var(--sub);margin-top:6px}.tabbar{display:flex;justify-content:space-around;gap:8px;border-top:1px solid var(--line);padding:12px 8px 4px;font-size:12px;color:var(--sub)}.tabbar b{font-weight:500;color:var(--action)}.bubble{background:var(--field);padding:14px 16px;border-radius:16px 16px 4px 16px;max-width:85%;margin:20px 0 24px auto;font-size:16px}.message{font-size:17px;line-height:1.8;margin:22px 0}.composer{background:var(--field);border-radius:26px;padding:12px 16px;display:flex;gap:14px;align-items:center;margin:0 18px 8px;color:var(--sub);font-size:17px}.composer .add{color:var(--action);font-size:24px}.composer .placeholder{flex:1}.chart{height:120px;display:flex;align-items:flex-end;gap:12px;margin-top:16px}.chart i{background:var(--action);flex:1;border-radius:5px 5px 0 0;opacity:.8}.week{display:flex;justify-content:space-between;background:var(--field);border-radius:10px;padding:12px;font-size:14px;margin:18px 0}.week b{color:var(--action)}@media(max-width:1200px){.gallery{grid-template-columns:repeat(2,minmax(300px,370px))}}@media(max-width:720px){.gallery{display:flex}}
</style></head><body><header><div><small>MOVELIQ / SHARED COLORS</small><h1>每次切换，都在同一个 App 里。</h1><p>六个代表页面使用同一组颜色。这里只比较颜色与层级，布局为简化示意，不新增课程、图表或聊天功能。</p></div><div class="controls"><button id="theme">深色</button><button id="large">大字号</button><a href="design.html" style="align-self:center;padding:10px">会话与记忆设计 ↗</a></div></header><main class="gallery" id="boards"></main><footer class="footer-notes"><strong>一致的基底，有意义的差别。</strong> 页面与导航用 page，容器用 surface，输入用 field；辅助内容用 secondary，操作用 action。媒体、分类图表与状态颜色保留原有语义。所有数字均为演示数据。<p><a href="design-system.md">查看完整 token 和迁移范围</a></p></footer><script>
const screens=[['首页','Moveliq',`<p class="eyebrow">10 月 23 日 · 星期五</p><h2>下午好，小林</h2><p class="intro">今天也按自己的节奏来。</p><div class="section-label">今日课程</div><div class="panel"><h3>全身力量 · 30 分钟</h3><p>今天先把基础动作做好。</p></div><div class="section-label">今日记录</div><div class="journal-row"><time>12:03</time><div>午餐记录<p>约 520 kcal · 蛋白质约 28 g</p></div></div><div class="journal-row"><time>08:10</time><div>晨间散步<p>20 分钟 · 轻松活动</p></div></div>`],['记录','记录',`<h2>记录</h2><div class="searchbox">⌕　搜索动作、食物或备注</div><div class="tabs"><button aria-selected="true">全部</button><button>训练</button><button>饮食</button></div><div class="section-label">今天 <span>2 条</span></div><div class="journal-row"><time>12:03</time><div>午餐记录<p>约 520 kcal · 蛋白质约 28 g</p></div></div><div class="journal-row"><time>08:10</time><div>晨间散步<p>20 分钟 · 轻松活动</p></div></div>`],['课程','课程表',`<h2>课程表</h2><p class="intro">留一点余地，慢慢建立规律。</p><div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><b>五</b><span>六</span><span>日</span></div><div class="panel"><p>今天 · 18:30</p><h3>全身力量</h3><p>约 30 分钟 · 4 个动作</p></div><div class="section-label">接下来的安排</div><div class="row-link">周日 · 轻松有氧<span class="chevron">›</span></div><div class="row-link">与 AI 教练聊聊<span class="chevron">›</span></div>`],['洞察','洞察',`<h2>洞察</h2><p class="intro">看见积累，也看见变化。</p><div class="panel"><p>本周训练</p><div class="metric">2 <span style="font-size:16px;font-weight:400">次</span></div><div class="chart" aria-label="演示图表"><i style="height:35%"></i><i style="height:60%"></i><i style="height:45%"></i><i style="height:80%"></i><i style="height:65%"></i><i style="height:95%"></i></div></div><div class="row-link">本周分析报告<span class="chevron">›</span></div><div class="row-link">活动与恢复趋势<span class="chevron">›</span></div>`],['设置','设置',`<h2>设置</h2><p class="intro">按你的习惯来。</p><div class="panel"><h3>小林</h3><p>账号与登录</p></div><div class="section-label">个人与 Milo</div><div class="row-link">Milo 的记忆<span class="chevron">›</span></div><div class="row-link">训练与日常<span class="chevron">›</span></div><div class="row-link">服务连接<span class="chevron">›</span></div><div class="section-label">使用偏好</div><div class="row-link">外观<span class="subtle">跟随系统 ›</span></div><div class="row-link">通知<span class="chevron">›</span></div>`],['聊天','Milo',`<p class="eyebrow" style="text-align:center">今天 09:32</p><div class="bubble">今天有点累，想轻松一点。</div><div class="message">那今天先轻一点。<br><br>你更想缩短训练，还是散散步就好？</div><p class="footnote">已记住的偏好可以在「Milo 的记忆」里修改。</p>`]];
document.getElementById('boards').innerHTML=screens.map(([key,title,body],i)=>`<section class="board"><div class="caption"><span>0${i+1} / ${key}</span><span>共享语义配色</span></div><div class="phone"><div class="status"><span>9:41</span><i class="island"></i><span>▮▮▮ 100%</span></div><nav class="nav"><span style="color:var(--action)">${key==='聊天'?'‹': 'm'}</span><strong>${title}</strong><span style="color:var(--action)">${key==='聊天'?'对话⌄':'···'}</span></nav><div class="scroll">${body}</div>${key==='聊天'?'<div class="composer"><span class="add">＋</span><span class="placeholder">和 Milo 聊聊…</span><span>♩</span></div>':'<div class="tabbar">'+['首页','记录','课程','洞察','设置'].map(x=>x===key?`<b>${x}</b>`:`<span>${x}</span>`).join('')+'</div>'}<div class="home"></div></div></section>`).join('');
document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('theme').textContent=document.body.classList.contains('dark')?'浅色':'深色'};document.getElementById('large').onclick=()=>document.body.classList.toggle('large');
</script></body></html>
